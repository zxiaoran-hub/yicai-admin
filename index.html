<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>异采 YiCai - 管理后台</title>
  <meta name="description" content="异采化妆品行业可信供应链B2B平台管理后台">
  <!-- 安全HTTP头（frame-ancestors/X-Frame-Options 需通过服务端HTTP头设置，meta标签无效已移除） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self';">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>异</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-root">
    <div class="login-page">
      <div class="login-container">
        <div class="login-logo">
          <div class="logo-icon">异</div>
          <h1>异采 YiCai</h1>
          <p>管理后台</p>
        </div>
        <div class="login-error" id="login-error"></div>
        <form id="login-form">
          <div class="form-group">
            <label>管理员邮箱</label>
            <input type="email" id="login-email" placeholder="admin@yicai.app" required>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码" required>
          </div>
          <button type="submit" class="btn btn-primary btn-lg btn-block" id="login-btn">登 录</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/security.js?v=13"></script>
  <script src="js/config.js?v=17"></script>
  <script src="js/app.js?v=16"></script>
  <script src="js/dashboard.js?v=15"></script>
  <script src="js/suppliers.js?v=15"></script>
  <script src="js/buyers.js?v=14"></script>
  <script src="js/inquiries.js?v=15"></script>
  <script src="js/orders.js?v=15"></script>
  <script src="js/roles.js?v=15"></script>
  <script src="js/users-perm.js?v=15"></script>
  <script src="js/companies.js?v=14"></script>
  <script src="js/audit.js?v=13"></script>
</body>
</html>
